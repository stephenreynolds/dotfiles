env = PATH,$HOME/.local/share/bin:$PATH

env = NVD_BACKEND,direct

env = GDK_BACKEND,wayland,x11
env = GDK_SCALE,1.5

env = CLUTTER_BACKEND,wayland

env = PROTON_USE_NTSYNC,1
env = PROTON_NVIDIA_LIBS,1

env = DOCKER_HOST,unix://$XDG_RUNTIME_DIR/docker.sock

env = HLDE_HYPRLOCK_CUSTOM,1
env = HLDE_HYPRIDLE_CUSTOM,1
