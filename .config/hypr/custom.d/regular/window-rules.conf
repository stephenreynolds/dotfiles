# See https://wiki.hyprland.org/Configuring/Window-Rules/

# Ignore maximize requests from apps.
windowrule {
  name = ignore-maximize-requests
  suppress_event = maximize
  match:class = .*
}


# Fix some dragging issues with XWayland
windowrule {
  name = fix-xwayland-dragging
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}


# Picture-in-Picture
$pictureInPicture = Picture-in-Picture
$firefoxModal = Extension.+Mozilla Firefox.*
$liveCaption = Live Caption

windowrule {
  name = windowrule-3
  float = on
  pin = on
  border_size = 0
  no_shadow = on
  focus_on_activate = on
  match:title = ($pictureInPicture|$firefoxModal|$liveCaption)
}

windowrule {
  name = windowrule-4
  keep_aspect_ratio = on
  match:title = ($pictureInPicture)
}


# Suppress fullscreen in some apps that can behave wierd
windowrule {
  name = windowrule-5
  suppress_event = fullscreen
  match:class = (piavpn|steam|tasty.javafx.launcher.LauncherFxApp)
}


# Center pavucontrol
windowrule {
  name = windowrule-6
  float = on
  center = on
  match:class = ^(pavucontrol|com.saivert.pwvucontrol)$
}


# Gaming
$steamApp = steam_app_.*

windowrule {
  name = windowrule-7
  fullscreen = on
  immediate = on
  keep_aspect_ratio = on
  content = game
  workspace = emptynm
  match:class = ($steamApp)
}


windowrule {
  name = windowrule-8
  immediate = off
  match:class = (steam_app_2420510)
}


# Riichi City
windowrule {
  name = windowrule-9
  keep_aspect_ratio = on
  render_unfocused = on
  content = game
  workspace = emptynm
  match:class = (Mahjong-JP.x86_64)
}


# Mahjong Soul
windowrule {
  name = windowrule-10
  keep_aspect_ratio = on
  render_unfocused = on
  maximize = on
  content = game
  workspace = emptynm
  match:class = (steam_app_2739990)
}


# MPV
windowrule {
  name = windowrule-11
  keep_aspect_ratio = on
  match:class = (mpv)
}


# Opacity
windowrule {
  name = windowrule-12
  opacity = 0.8 override
  match:class = (sioyek)
}


# Float
windowrule {
  name = windowrule-13
  float = on
  match:class = (.blueman-manager-wrapped)
}

windowrule {
  name = windowrule-14
  float = on
  match:class = (org.gnome.Calculator)
}

windowrule {
  name = windowrule-15
  float = on
  match:class = (org.gnome.clocks)
}

windowrule {
  name = windowrule-16
  float = on
  match:class = (OneDriveGUI)
}

windowrule {
  name = windowrule-17
  float = on
  match:class = (qalculate-gtk)
}

windowrule {
  name = windowrule-18
  float = on
  match:class = (steam)
  match:title = (Steam Settings|Friends List)
}

windowrule {
  name = windowrule-19
  float = on
  match:class = (yad)
}

windowrule {
  name = windowrule-20
  float = on
  match:class = (xdg-desktop-portal.*|org.freedesktop.impl.portal.desktop.kde)
}


# Polkit agent
$polkitAgent = lxqt-policykit-agent|polkit-gnome-authentication-agent-1|polkit-mate-authentication-agent-1|org.kde.polkit-kde-authentication-agent-1
windowrule {
  name = windowrule-21
  float = on
  center = on
  match:class = ($polkitAgent)
}


windowrule {
  name = windowrule-22
  opacity = 1.0
  match:content = game
}

windowrule {
  name = windowrule-23
  opacity = 1.0
  match:class = zen
}

windowrule {
  name = windowrule-24
  opacity = 1.0
  match:class = (BambuStudio)
}

windowrule {
  name = windowrule-25
  opacity = 1.0
  match:class = (org.freecad.FreeCAD)
}


# Vicinae
layerrule {
  name = layerrule-1
  blur = on
  ignore_alpha = 0
  no_anim = on
  match:namespace = vicinae
}

# Disable translucent windows
windowrule = opacity 1, match:fullscreen 0
