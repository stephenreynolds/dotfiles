# Custom binds. Make sure to unbind any default binds before you add new ones.

# Example:
# unbind = SUPER, A
# bind = SUPER, A, exec, kitty

# You can also remove all the default binds with
# unbind = all

unbind = $mainMod, 1
unbind = $mainMod, 2
unbind = $mainMod, 3
unbind = $mainMod, 4
unbind = $mainMod, 5
unbind = $mainMod, 6
unbind = $mainMod, 7
unbind = $mainMod, 8
unbind = $mainMod, 9
unbind = $mainMod, 0
unbind = $mainMod SHIFT, 1
unbind = $mainMod SHIFT, 2
unbind = $mainMod SHIFT, 3
unbind = $mainMod SHIFT, 4
unbind = $mainMod SHIFT, 5
unbind = $mainMod SHIFT, 6
unbind = $mainMod SHIFT, 7
unbind = $mainMod SHIFT, 8
unbind = $mainMod SHIFT, 9
unbind = $mainMod SHIFT, 0
unbind = $mainMod, S
unbind = $mainMod SHIFT, S
unbind = $mainMod, E
unbind = $mainMod, V
unbind = $mainMod, C
unbind = $mainMod, F
unbind = $mainMod SHIFT, F
unbind = $mainMod, M
unbind = $mainMod, Q
unbind = $mainMod, R

$uwsm = uwsm app --

$scripts = $HOME/.config/hypr/scripts

bind = SUPER, V, fullscreen, 1
bind = SUPER SHIFT, V, fullscreen, 0
bind = SUPER, F, togglefloating
bind = SUPER SHIFT, F, pin
bind = SUPER ALT, F, workspaceopt, allfloat

# Layout
bind = SUPER SHIFT, U, exec, $scripts/toggle_layout.sh

# Dwindle layout
bind = SUPER, S, togglesplit
bind = SUPER, U, pseudo

# Master layout
bind = SUPER, S, layoutmsg, rollnext
bind = SUPER SHIFT, S, layoutmsg, rollprev
bind = SUPER, U, layoutmsg, orientationcycle center right

# Focus last window
bind = $mainMod, Y, focuscurrentorlast
bind = ALT, Tab, focuscurrentorlast

# Close active window
bind = SUPER, C, exec, $scripts/kill_active.sh

# Terminal
bind = SUPER, T, exec, $uwsm $terminal

# Browser
bind = SUPER, W, exec, $uwsm zen-browser
bind = SUPER SHIFT, W, exec, $uwsm $scripts/private_browser.sh

# Launcher
bind = SUPER, SPACE, exec, $uwsm $menu

# Move focus with mod + arrow keys
unbind = SUPER, H
unbind = SUPER, L
unbind = SUPER, K
unbind = SUPER, J
bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d

# Move focus with mod + Shift + arrow keys
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, L, movewindow, r
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, J, movewindow, d


# Group window
bind = SUPER, G, togglegroup
bind = SUPER CTRL, G, moveoutofgroup
bind = SUPER ALT, G, lockactivegroup, toggle
bind = SUPER ALT, H, moveintogroup, l
bind = SUPER ALT, L, moveintogroup, r
bind = SUPER ALT, K, moveintogroup, u
bind = SUPER ALT, J, moveintogroup, d

# Switch to next window in group
bind = SUPER, Comma, changegroupactive, b
bind = SUPER, Period, changegroupactive, f
bind = SUPER SHIFT, Comma, movegroupwindow, b
bind = SUPER SHIFT, Period, movegroupwindow, f

# Next/previous workspace on monitor
bind = SUPER, N, workspace, m-1
bind = SUPER, E, workspace, m+1
bind = SUPER SHIFT, N, movetoworkspace, m-1
bind = SUPER SHIFT, E, movetoworkspace, m+1

# Next empty workspace on monitor
bind = SUPER, O, exec, $scripts/focus_empty.sh
bind = SUPER SHIFT, O, exec, $scripts/move_to_empty.sh

# Example special workspace (scratchpad)
bind = SUPER, Return, togglespecialworkspace
bind = SUPER SHIFT, Return, movetoworkspace, special

binde = SUPER CTRL, H, resizeactive, -10 0
binde = SUPER CTRL, L, resizeactive, 10 0
binde = SUPER CTRL, K, resizeactive, 0 -10
binde = SUPER CTRL, J, resizeactive, 0 10

bind = SUPER SHIFT, Q, exec, hyprctl reload

# Color picker
bind = $mainMod SHIFT, C, exec, hyprpicker --format=hex --autocopy

# Capture the active output
unbind = , Print
bind = , Print, exec, grimblast save output - | swappy -f -
# Capture all visible windows
bind = ALT, Print, exec, grimblast save screen - | swappy -f -
# Capture the active window
bind = CTRL, Print, exec, grimblast save active - | swappy -f -
# Capture an area selection
bind = SHIFT, Print, exec, grimblast save area - | swappy -f -
# Copy screenshot text using OCR
bind = SUPER, Print, exec, grimblast --freeze save area - | tesseract - - | wl-copy && notify-send -t 3000 'OCR result copied to clipboard'

$getActiveWorkspaceId = $(hyprctl activeworkspace -j | jaq -r '.id')
bind = SUPER ALT, 1, execr, hyprctl keyword bind SUPER,1, workspace, $getActiveWorkspaceId
bind = SUPER ALT, 2, execr, hyprctl keyword bind SUPER,2, workspace, $getActiveWorkspaceId
bind = SUPER ALT, 3, execr, hyprctl keyword bind SUPER,3, workspace, $getActiveWorkspaceId
bind = SUPER ALT, 4, execr, hyprctl keyword bind SUPER,4, workspace, $getActiveWorkspaceId
bind = SUPER ALT, 5, execr, hyprctl keyword bind SUPER,5, workspace, $getActiveWorkspaceId
bind = SUPER ALT, 6, execr, hyprctl keyword bind SUPER,6, workspace, $getActiveWorkspaceId
bind = SUPER ALT, 7, execr, hyprctl keyword bind SUPER,7, workspace, $getActiveWorkspaceId
bind = SUPER ALT, 8, execr, hyprctl keyword bind SUPER,8, workspace, $getActiveWorkspaceId
bind = SUPER ALT, 9, execr, hyprctl keyword bind SUPER,9, workspace, $getActiveWorkspaceId
bind = SUPER ALT, 0, execr, hyprctl keyword bind SUPER,0, workspace, $getActiveWorkspaceId

$getActiveWindowAddress = $(hyprctl activewindow -j | jaq -r '.address')
bind = SUPER CTRL, 1, execr, hyprctl keyword bind SUPER,1, focuswindow, address:$getActiveWindowAddress
bind = SUPER CTRL, 2, execr, hyprctl keyword bind SUPER,2, focuswindow, address:$getActiveWindowAddress
bind = SUPER CTRL, 3, execr, hyprctl keyword bind SUPER,3, focuswindow, address:$getActiveWindowAddress
bind = SUPER CTRL, 4, execr, hyprctl keyword bind SUPER,4, focuswindow, address:$getActiveWindowAddress
bind = SUPER CTRL, 5, execr, hyprctl keyword bind SUPER,5, focuswindow, address:$getActiveWindowAddress
bind = SUPER CTRL, 6, execr, hyprctl keyword bind SUPER,6, focuswindow, address:$getActiveWindowAddress
bind = SUPER CTRL, 7, execr, hyprctl keyword bind SUPER,7, focuswindow, address:$getActiveWindowAddress
bind = SUPER CTRL, 8, execr, hyprctl keyword bind SUPER,8, focuswindow, address:$getActiveWindowAddress
bind = SUPER CTRL, 9, execr, hyprctl keyword bind SUPER,9, focuswindow, address:$getActiveWindowAddress
bind = SUPER CTRL, 0, execr, hyprctl keyword bind SUPER,0, focuswindow, address:$getActiveWindowAddress

# Run submap
bind = SUPER, R, submap, run_submap
submap = run_submap
bind = , D, exec,  vesktop
bind = , D, submap, reset
bind = , F, exec, $uswm $fileManager
bind = , F, submap, reset
bind = , M, exec, electron-mail
bind = , M, submap, reset
bind = , O, exec, $uwsm obsidian
bind = , O, submap, reset
bind = , P, exec, $uwsm pwvucontrol
bind = , P, submap, reset
bind = , S, exec, gtk-launch steam.desktop
bind = , S, submap, reset
bind = , Escape, submap, reset
submap = reset

# Passthrough submap
bind = SUPER, Pause, submap, passthrough_submap
submap = passthrough_supmap
bind = SUPER, Pause, submap, reset
submap = reset
